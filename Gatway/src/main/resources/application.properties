server.port=9001
spring.application.name=API_GATEWAY

#spring.config.import=optional:configserver:http://localhost:9000
#spring.cloud.config.uri=http://localhost:9000

spring.main.web-application-type=reactive
spring.main.allow-bean-definition-overriding=true

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.instanceId=${spring.application.name}:${server.port}
spring.cloud.consul.discovery.healthCheckInterval=12s
spring.cloud.consul.config.enabled=false



#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true
#spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
#spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.default-filters[1]=AddResponseHeader=Access-Control-Allow-Origin, *


spring.cloud.gateway.server.webflux.routes[0].id=allergy_service_route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://g2-allergy-service/
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/allergy-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/allergy-service/(?<segment>.*), /api/v1/$\{segment}
#spring.cloud.gateway.server.webflux.routes[0].filters[1].name==CircuitBreaker
#spring.cloud.gateway.server.webflux.routes[0].filters[1].args.name=allergyServiceCircuitBreaker
#spring.cloud.gateway.server.webflux.routes[0].filters[1].args.fallbackuri=forward:/allergy-service-fallback


spring.devtools.add-properties=false

#logger
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.medibridge.pas.*=INFO
logging.file.name=applogs.log
logging.level.[org.hibernate]=ERROR
logging.level.[com.medibridge.pas.*]=DEBUG

management.endpoint.gateway.access=true
management.health.circuitbreakers.enabled=true

management.endpoints.web.exposure.include=*

